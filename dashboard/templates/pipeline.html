{% extends "layout.html" %}

{% block content %}
<div class="glass-panel fade-in">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600; color: var(--text-color);">New Research Pipeline</h2>
        <p style="color: var(--text-muted);">Step 1 of 3: Define Criteria</p>

        <!-- Progress Bar -->
        <div style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; opacity: 0.8;">
            <div style="height: 4px; width: 40px; background: var(--primary-color); border-radius: 2px;"></div>
            <div style="height: 4px; width: 40px; background: rgba(0,0,0,0.1); border-radius: 2px;"></div>
            <div style="height: 4px; width: 40px; background: rgba(0,0,0,0.1); border-radius: 2px;"></div>
        </div>
    </div>

    <!-- Wizard Container -->
    <div id="pipeline-content">
        <!-- Step 1: Intake Form -->
        <form hx-post="/pipeline/intake" hx-target="#pipeline-content" hx-swap="innerHTML" class="fade-in">

            <div style="display: grid; gap: 1.5rem; max-width: 600px; margin: 0 auto;">

                <!-- Industry -->
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color);">
                        1. Industry & Reference Companies
                    </label>
                    <textarea name="industry" rows="3"
                        placeholder="e.g. Custom packaging manufacturers. Like Packlane or Arka." required></textarea>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">
                        Mention any competitors or reference companies here.
                    </p>
                </div>

                <!-- Revenue -->
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color);">
                        2. Target Revenue
                    </label>
                    <input type="text" name="revenue" placeholder="e.g. $5M to $50M" required>
                </div>

                <!-- Geography -->
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color);">
                        3. Geography
                    </label>
                    <input type="text" name="geography" placeholder="e.g. United States and Canada" required>
                </div>

                <!-- Ownership -->
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color);">
                        4. Ownership Structure
                    </label>
                    <select name="ownership">
                        <option value="No preference">No preference</option>
                        <option value="Private/Family-owned">Private / Family-owned</option>
                        <option value="PE-backed">PE-backed</option>
                    </select>
                </div>

                <!-- Capabilities -->
                <div>
                    <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-color);">
                        5. Key Capabilities
                    </label>
                    <textarea name="capabilities" rows="2"
                        placeholder="e.g. Must have in-house offset printing"></textarea>
                </div>

                <!-- Submit -->
                <div style="margin-top: 1rem; text-align: center;">
                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; justify-content: center; padding: 1rem;">
                        Analyze & Create Session &rarr;
                    </button>
                    <div class="htmx-indicator" style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                        <span class="loader"></span> Analyzing criteria with AI...
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>

<style>
    .htmx-request .htmx-indicator {
        display: block;
    }

    .htmx-indicator {
        display: none;
    }
</style>
{% endblock %}
