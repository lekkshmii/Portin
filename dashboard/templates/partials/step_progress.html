<div class="fade-in" hx-get="/pipeline/status?session_id={{ session_id }}" hx-trigger="every 2s" hx-swap="outerHTML">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600;">Discovery in Progress...</h2>
        <div class="badge badge-warning" style="margin-top: 0.5rem;">Session #{{ session_id }} Running</div>

        <!-- Progress Bar (Animated) -->
        <div style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; opacity: 0.8;">
            <div style="height: 4px; width: 40px; background: var(--primary-color); border-radius: 2px;"></div>
            <div style="height: 4px; width: 40px; background: var(--primary-color); border-radius: 2px;">
                <div style="height: 100%; background: rgba(255,255,255,0.5); animation: progress 1s infinite linear;">
                </div>
            </div>
            <div style="height: 4px; width: 40px; background: rgba(0,0,0,0.1); border-radius: 2px;"></div>
        </div>
    </div>

    <!-- Live Stats -->
    <div class="stats-grid" style="max-width: 600px; margin: 0 auto;">
        <div class="stat-card" style="text-align: center;">
            <div class="stat-label">Companies Found</div>
            <div class="stat-value" style="color: var(--primary-color);">{{ companies_found }}</div>
        </div>
        <div class="stat-card" style="text-align: center;">
            <div class="stat-label">Status</div>
            <div class="stat-value" style="font-size: 1.2rem;">{{ status | title }}</div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem;">
        <span class="loader"
            style="display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-muted); border-bottom-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 0.5rem;"></span>
        Scouring the web and analyzing relevance...
    </div>

    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</div>
