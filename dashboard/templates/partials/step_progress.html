<div class="fade-in" hx-get="/pipeline/status?session_id={{ session_id }}" hx-trigger="every 2s" hx-swap="outerHTML">
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600;">Discovery in Progress...</h2>
        <div class="badge badge-warning" style="margin-top: 0.5rem; display: inline-block;">Session #{{ session_id }}
            Running</div>
    </div>

    <!-- Live Stats -->
    <div class="stats-grid" style="max-width: 600px; margin: 0 auto 2rem;">
        <div class="stat-card" style="text-align: center; padding: 1rem;">
            <div class="stat-label">Companies Found</div>
            <div class="stat-value" style="color: var(--primary-color); font-size: 2rem;">{{ companies_found }}</div>
        </div>
        <div class="stat-card" style="text-align: center; padding: 1rem;">
            <div class="stat-label">Status</div>
            <div class="stat-value" style="font-size: 1.2rem;">{{ status | title }}</div>
        </div>
    </div>

    <!-- Log Output (Clean UI) -->
    <div class="glass-panel" style="max-width: 700px; margin: 0 auto; padding: 0; overflow: hidden;">
        <div style="padding: 1rem; border-bottom: 1px solid var(--glass-border); background: rgba(255,255,255,0.4);">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <div class="loader" style="width: 14px; height: 14px; border-width: 2px;"></div>
                <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Live Research
                    Updates</span>
            </div>
        </div>

        <div id="terminal-scroll"
            style="height: 300px; overflow-y: auto; padding: 1.5rem; background: rgba(255,255,255,0.2);">

            <div hx-get="/pipeline/logs?session_id={{ session_id }}" hx-trigger="every 500ms" hx-swap="innerHTML">
                <div style="color: var(--text-muted); font-style: italic;">Initializing engine...</div>
            </div>
        </div>
    </div>

    <!-- Auto-scroll Script -->
    <script>
        var term = document.getElementById('terminal-scroll');
        if (term) {
            // Auto scroll to bottom
            setInterval(function () {
                if (term.scrollHeight - term.scrollTop - term.clientHeight < 150) {
                    term.scrollTop = term.scrollHeight;
                }
            }, 500);
        }
    </script>

    <style>
        .log-line {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-color);
            line-height: 1.5;
            padding-left: 1rem;
            border-left: 2px solid var(--primary-color);
            background: rgba(255, 255, 255, 0.3);
            border-radius: 0 4px 4px 0;
            padding: 0.3rem 0.8rem;
        }
    </style>
</div>
